<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>배달의민족 엔딩</title>
<!-- 도현체(BM 도현): 우아한형제들이 만든 무료 폰트 (Google Fonts 배포본) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root { --mint: #2ac1bc; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .logo {
    position: relative;
    font-family: "Do Hyeon", "BM DoHyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(48px, 15vmin, 200px);
    line-height: 1;
    color: var(--mint);
    letter-spacing: -0.02em;
    white-space: nowrap;
    opacity: 0;
    transform-origin: 50% 100%;
  }
  .logo .ui { font-size: 0.62em; vertical-align: 0.12em; margin: 0 0.02em; }

  /* 등장 */
  .logo.in { animation: logoIn 1s ease forwards; }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 입김에 촛불처럼 흔들리는 순간 (짧게) */
  .logo.blow { animation: blow 0.45s ease-in forwards; }
  @keyframes blow {
    0%   { opacity: 1;    transform: skewX(0deg)  scale(1, 1);       filter: brightness(1.15); }
    30%  { opacity: 0.85; transform: skewX(-6deg) scale(1.01, 0.97); filter: brightness(1.3); }
    55%  { opacity: 1;    transform: skewX(3deg)  scale(1, 1.01);    filter: brightness(0.9); }
    80%  { opacity: 0.7;  transform: skewX(-8deg) scale(1.02, 0.95); filter: brightness(1.2); }
    100% { opacity: 0.9;  transform: skewX(-4deg) scale(1.01, 0.98); filter: brightness(1); }
  }

  /* 훅 — 한순간에 꺼짐 */
  .logo.out { animation: none; opacity: 0; transition: none; }

  canvas.smoke {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .replay {
    position: absolute;
    right: 16px;
    bottom: 16px;
    padding: 10px 16px;
    font: 15px/1 "Do Hyeon", sans-serif;
    color: #888;
    background: transparent;
    border: 1px solid #333;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, color 0.2s, border-color 0.2s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:hover { color: var(--mint); border-color: var(--mint); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <h1 class="logo" id="logo" aria-label="배달의민족"><span class="seg">배달</span><span class="seg ui">의</span><span class="seg">민족</span></h1>
    <canvas class="smoke" id="smoke"></canvas>
    <button class="replay" id="replay" type="button">↻ 다시 보기</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logo = $("logo"), replayBtn = $("replay"), canvas = $("smoke");
  const ctx = canvas.getContext("2d");

  // ===== 타임라인 (ms) — 숫자만 바꾸면 길이 조절 =====
  const T = {
    logoIn:   300,   // 로고 등장
    blow:     3000,  // 입김 (로고가 촛불처럼 흔들림)
    dissolve: 3450,  // 로고가 연기로 흩어지기 시작
    done:     6200,  // 다시보기 버튼
  };
  const SMOKE_MS = 2200; // 연기로 완전히 사라지는 데 걸리는 시간. 끝나면 화면을 완전히 지워 잔상 없음

  let timers = [], rafId = 0, glowRaf = 0, particles = [], audioCtx = null;
  let dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // ===== 켜져 있는 동안 촛불처럼 은은하게 일렁이는 빛 =====
  function startGlow() {
    const step = (now) => {
      const n = 0.85 + 0.1 * Math.sin(now / 95) + 0.05 * Math.sin(now / 41 + 1.3) + (Math.random() - 0.5) * 0.04;
      logo.style.textShadow = `0 0 ${Math.round(22 * n)}px rgba(42,193,188,${(0.45 * n).toFixed(2)})`;
      glowRaf = requestAnimationFrame(step);
    };
    glowRaf = requestAnimationFrame(step);
  }
  function stopGlow() { cancelAnimationFrame(glowRaf); logo.style.textShadow = "none"; }

  // ===== 로고 글자를 픽셀 입자로 변환 =====
  function logoToParticles() {
    const rect = logo.getBoundingClientRect();
    const pad = 20;
    const off = document.createElement("canvas");
    off.width = Math.ceil(rect.width + pad * 2);
    off.height = Math.ceil(rect.height + pad * 2);
    const o = off.getContext("2d");
    o.fillStyle = "#2ac1bc";
    o.textBaseline = "alphabetic";
    for (const seg of logo.querySelectorAll(".seg")) {
      const cs = getComputedStyle(seg);
      o.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      // 각 글자 덩어리의 실제 화면 위치에 맞춰 그림 (Range 로 글리프 박스 측정)
      const range = document.createRange();
      range.selectNodeContents(seg);
      const r = range.getBoundingClientRect();
      const m = o.measureText(seg.textContent);
      const boxH = m.fontBoundingBoxAscent + m.fontBoundingBoxDescent;
      const baseline = r.top + (r.height - boxH) / 2 + m.fontBoundingBoxAscent;
      o.fillText(seg.textContent, r.left - rect.left + pad, baseline - rect.top + pad);
    }
    const img = o.getImageData(0, 0, off.width, off.height).data;
    const gap = 2; // 입자 간격(px). 작을수록 촘촘
    const out = [];
    const minX = rect.left - pad, minY = rect.top - pad, w = rect.width;
    for (let y = 0; y < off.height; y += gap) {
      for (let x = 0; x < off.width; x += gap) {
        const a = img[(y * off.width + x) * 4 + 3];
        if (a < 128) continue;
        const px = minX + x, py = minY + y;
        const rel = (px - rect.left) / w; // 왼쪽 → 오른쪽 순서로 흩어짐
        out.push({
          x: px, y: py,
          vx: 0.05 + Math.random() * 0.35,
          vy: -(0.4 + Math.random() * 0.7),
          delay: rel * 450 + Math.random() * 220,
          life: 900 + Math.random() * 900,
          phase: Math.random() * Math.PI * 2,
          size: gap,
        });
      }
    }
    return out;
  }

  function dissolve() {
    particles = logoToParticles();
    logo.classList.add("out"); // DOM 로고는 숨기고 같은 자리의 입자가 이어받음
    const t0 = performance.now();
    const step = (now) => {
      const el = now - t0;
      canvas.style.filter = `blur(${Math.min(5, el / 300).toFixed(2)}px)`; // 점점 부드럽게 번짐
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of particles) {
        const t = el - p.delay;
        let alpha = 1, mix = 0;
        if (t > 0) {
          const k = Math.min(1, t / p.life);
          p.phase += 0.06;
          p.vy -= 0.018;               // 위로 점점 빨라짐
          p.x += p.vx + Math.sin(p.phase + p.y * 0.03) * (0.4 + k * 1.4); // 위로 갈수록 크게 일렁임
          p.y += p.vy;
          p.size = 2 + k * 5;          // 퍼지면서 커짐
          alpha = (1 - k) * (1 - k) * (1 - k * 0.5);
          mix = Math.min(1, k * 2.2);  // 민트 → 회색 연기
          if (k >= 1) continue;
        }
        const r = Math.round(42 + (190 - 42) * mix);
        const g = Math.round(193 + (195 - 193) * mix);
        const b = Math.round(188 + (195 - 188) * mix);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      if (el < SMOKE_MS) {
        rafId = requestAnimationFrame(step);
      } else {
        // 잔상 방지: 남은 입자를 모두 버리고 화면을 완전히 지움
        particles = [];
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        canvas.style.filter = "none";
      }
    };
    rafId = requestAnimationFrame(step);
  }

  // ===== "후-" 입김 소리 (사용자 클릭 이후에만 재생 가능) =====
  function playBlowSound() {
    if (!audioCtx) return;
    const dur = 0.6, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * dur, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.35, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(rafId); stopGlow();
    particles = []; ctx.clearRect(0, 0, innerWidth, innerHeight); canvas.style.filter = "none";
    logo.classList.remove("in", "blow", "out");
    replayBtn.classList.remove("show");
    void logo.offsetWidth;
  }

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function play() {
    reset();
    at(T.logoIn, () => { logo.classList.add("in"); startGlow(); });
    at(T.blow, () => { logo.classList.replace("in", "blow"); playBlowSound(); });
    at(T.dissolve, () => {
      stopGlow();
      logo.classList.remove("blow");
      logo.style.opacity = 1;          // 흔들림 끝난 원래 위치에서 측정
      void logo.offsetWidth;
      dissolve();
      logo.style.opacity = "";
    });
    at(T.done, () => replayBtn.classList.add("show"));
  }

  replayBtn.addEventListener("click", () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) { audioCtx = null; }
    play();
  });

  // 외부에서 호출: window.playBaeminEnding()
  window.playBaeminEnding = play;

  // 폰트 로드 후 자동 재생 (?autoplay=0 이면 대기)
  const auto = new URLSearchParams(location.search).get("autoplay") !== "0";
  if (auto) (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
</body>
</html>
