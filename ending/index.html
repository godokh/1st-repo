<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>배달의민족 엔딩</title>
<!-- 도현체(BM 도현): 우아한형제들이 만든 무료 폰트 (Google Fonts 배포본) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root { --mint: #2ac1bc; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .logo {
    position: relative;
    font-family: "Do Hyeon", "BM DoHyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(48px, 15vmin, 200px);
    line-height: 1;
    color: var(--mint);
    letter-spacing: -0.02em;
    white-space: nowrap;
    opacity: 0;
    transform-origin: 50% 100%;
  }
  .logo .ui { font-size: 0.62em; vertical-align: 0.12em; margin: 0 0.02em; }

  /* 등장 */
  .logo.in { animation: logoIn 1s ease forwards; }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 입김에 촛불처럼 흔들리는 순간 (짧게) */
  .logo.blow { animation: blow 0.45s ease-in forwards; }
  @keyframes blow {
    0%   { opacity: 1;    transform: skewX(0deg)  scale(1, 1);       filter: brightness(1.15); }
    30%  { opacity: 0.85; transform: skewX(-6deg) scale(1.01, 0.97); filter: brightness(1.3); }
    55%  { opacity: 1;    transform: skewX(3deg)  scale(1, 1.01);    filter: brightness(0.9); }
    80%  { opacity: 0.7;  transform: skewX(-8deg) scale(1.02, 0.95); filter: brightness(1.2); }
    100% { opacity: 0.9;  transform: skewX(-4deg) scale(1.01, 0.98); filter: brightness(1); }
  }

  /* 훅 — 한순간에 꺼짐 */
  .logo.out { animation: none; opacity: 0; transition: none; }

  canvas.smoke {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .replay {
    position: absolute;
    right: 16px;
    bottom: 16px;
    padding: 10px 16px;
    font: 15px/1 "Do Hyeon", sans-serif;
    color: #888;
    background: transparent;
    border: 1px solid #333;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, color 0.2s, border-color 0.2s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:hover { color: var(--mint); border-color: var(--mint); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <h1 class="logo" id="logo" aria-label="배달의민족">배달<span class="ui">의</span>민족</h1>
    <canvas class="smoke" id="smoke"></canvas>
    <button class="replay" id="replay" type="button">↻ 다시 보기</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logo = $("logo"), replayBtn = $("replay"), canvas = $("smoke");
  const ctx = canvas.getContext("2d");

  // ===== 타임라인 (ms) — 숫자만 바꾸면 길이 조절 =====
  const T = {
    logoIn: 300,   // 로고 등장
    blow:   3000,  // 입김 (로고가 촛불처럼 흔들림)
    out:    3450,  // 훅 꺼짐
    done:   6000,  // 다시보기 버튼
  };
  const SMOKE = true; // 꺼진 뒤 로고 자리에서 연기 피어오름 (false 면 연기 없음)

  let timers = [], rafId = 0, flickerRaf = 0, particles = [], audioCtx = null;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // ===== 켜져 있는 동안 촛불처럼 은은하게 일렁이는 빛 =====
  function startGlow() {
    const step = (now) => {
      const n = 0.85 + 0.1 * Math.sin(now / 95) + 0.05 * Math.sin(now / 41 + 1.3) + (Math.random() - 0.5) * 0.04;
      logo.style.textShadow = `0 0 ${Math.round(22 * n)}px rgba(42,193,188,${(0.45 * n).toFixed(2)})`;
      flickerRaf = requestAnimationFrame(step);
    };
    flickerRaf = requestAnimationFrame(step);
  }
  function stopGlow() { cancelAnimationFrame(flickerRaf); logo.style.textShadow = "none"; }

  // ===== 꺼진 뒤 연기 (로고 윗부분 여러 지점에서 가늘게) =====
  function emitSmoke(rect, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: rect.left + Math.random() * rect.width,
        y: rect.top + rect.height * (0.15 + Math.random() * 0.5),
        vx: (Math.random() - 0.5) * 0.2 - 0.1,
        vy: -(0.5 + Math.random() * 0.6),
        r: 3 + Math.random() * 4,
        life: 0,
        max: 90 + Math.random() * 70,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }
  function smokeLoop(rect) {
    const start = performance.now(), emitUntil = start + 700;
    const step = (now) => {
      if (now < emitUntil) emitSmoke(rect, now - start < 200 ? 6 : 2);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      particles = particles.filter((p) => p.life < p.max);
      for (const p of particles) {
        p.life++;
        p.phase += 0.05;
        p.x += p.vx + Math.sin(p.phase) * 0.3;
        p.y += p.vy;
        p.r += 0.08;
        const t = p.life / p.max;
        const a = 0.1 * (1 - t) * (1 - t) * Math.min(1, p.life / 8);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, `rgba(200,200,200,${a})`);
        g.addColorStop(1, "rgba(200,200,200,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (now < emitUntil || particles.length) rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  // ===== "후-" 입김 소리 (사용자 클릭 이후에만 재생 가능) =====
  function playBlowSound() {
    if (!audioCtx) return;
    const dur = 0.6, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * dur, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.35, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(rafId); stopGlow();
    particles = []; ctx.clearRect(0, 0, innerWidth, innerHeight);
    logo.classList.remove("in", "blow", "out");
    replayBtn.classList.remove("show");
    void logo.offsetWidth;
  }

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function play() {
    reset();
    at(T.logoIn, () => { logo.classList.add("in"); startGlow(); });
    at(T.blow, () => { logo.classList.replace("in", "blow"); playBlowSound(); });
    at(T.out, () => {
      const rect = logo.getBoundingClientRect();
      stopGlow();
      logo.classList.replace("blow", "out");
      if (SMOKE) smokeLoop(rect);
    });
    at(T.done, () => replayBtn.classList.add("show"));
  }

  replayBtn.addEventListener("click", () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) { audioCtx = null; }
    play();
  });

  // 외부에서 호출: window.playBaeminEnding()
  window.playBaeminEnding = play;

  // 폰트 로드 후 자동 재생 (?autoplay=0 이면 대기)
  const auto = new URLSearchParams(location.search).get("autoplay") !== "0";
  if (auto) (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
</body>
</html>
