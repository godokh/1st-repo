<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>배달의민족 엔딩</title>
<!-- 도현체(BM 도현): 우아한형제들이 만든 무료 폰트 (Google Fonts 배포본) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root { --mint: #2ac1bc; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .logo {
    position: relative;
    font-family: "Do Hyeon", "BM DoHyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(48px, 15vmin, 200px);
    line-height: 1;
    color: var(--mint);
    letter-spacing: -0.02em;
    white-space: nowrap;
    opacity: 0;
    transform-origin: 50% 100%;
    padding: 0.6em 1.2em;  /* 연기 효과가 번질 여유 공간 (없으면 효과가 네모나게 잘림) */
  }
  .logo .ui { font-size: 0.62em; vertical-align: 0.12em; margin: 0 0.02em; }

  /* 등장 */
  .logo.in { animation: logoIn 1s ease forwards; }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 바람에 휘청이는 동안: 아래 SVG 필터(살짝 일렁임)를 글자에 직접 적용 */
  .logo.smoking { animation: none; opacity: 1; filter: url(#smokeFx); will-change: transform; }
  /* 꺼진 뒤: 한 프레임에 완전히 숨김 (잔상 없음) */
  .logo.out { animation: none; opacity: 0; filter: none; }

  /* 꺼진 뒤 피어오르는 가는 연기 줄기 */
  canvas.smoke {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .fx-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .replay {
    position: absolute;
    right: 16px;
    bottom: 16px;
    padding: 10px 16px;
    font: 15px/1 "Do Hyeon", sans-serif;
    color: #888;
    background: transparent;
    border: 1px solid #333;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, color 0.2s, border-color 0.2s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:hover { color: var(--mint); border-color: var(--mint); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <h1 class="logo" id="logo" aria-label="배달의민족"><span class="seg">배달</span><span class="seg ui">의</span><span class="seg">민족</span></h1>
    <!-- 연기 효과용 SVG 필터: 노이즈로 글자를 일렁이게 비틀고(displacement) 흐리게 번지게(blur) 함 -->
    <svg class="fx-defs" aria-hidden="true">
      <filter id="smokeFx" x="-50%" y="-120%" width="200%" height="300%" color-interpolation-filters="sRGB">
        <feTurbulence id="fxNoise" type="fractalNoise" baseFrequency="0.010 0.035" numOctaves="3" seed="7" result="noise" />
        <feDisplacementMap id="fxDisp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="disp" />
        <feGaussianBlur id="fxBlur" in="disp" stdDeviation="0" result="blur" />
        <feColorMatrix id="fxSat" in="blur" type="saturate" values="1" />
      </filter>
    </svg>
    <canvas class="smoke" id="smokeSoft"></canvas>
    <canvas class="smoke" id="smoke"></canvas>
    <button class="replay" id="replay" type="button">↻ 다시 보기</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logo = $("logo"), replayBtn = $("replay");
  const fxNoise = $("fxNoise"), fxDisp = $("fxDisp"), fxBlur = $("fxBlur"), fxSat = $("fxSat");

  // ===== 타임라인 (ms) — 숫자만 바꾸면 길이 조절 =====
  const T = {
    logoIn:   300,   // 로고 등장
    dissolve: 3000,  // 바람이 불어 꺼지는 순간
    done:     5700,  // 다시보기 버튼
  };
  // 참고 영상(촛불 끄기)의 타이밍을 그대로 따름
  const LEAN_MS  = 90;   // ① 바람이 닿아 왼쪽으로 S자로 휨
  const SHRINK_MS = 80;  // ② 작게 움츠러듦
  const WHIP_MS  = 90;   // ③ 오른쪽 위로 확 길게 끌려감 → 그 직후 한 프레임에 꺼짐
  const SMOKE_MS = 2200; // ④ 꺼진 뒤 가는 연기 줄기가 피어올라 흩어지는 시간 (끝나면 캔버스를 비워 잔상 없음)

  let timers = [], rafId = 0, glowRaf = 0, audioCtx = null;

  // ===== 켜져 있는 동안 촛불처럼 은은하게 일렁이는 빛 =====
  function startGlow() {
    const step = (now) => {
      const n = 0.85 + 0.1 * Math.sin(now / 95) + 0.05 * Math.sin(now / 41 + 1.3) + (Math.random() - 0.5) * 0.04;
      logo.style.textShadow = `0 0 ${Math.round(22 * n)}px rgba(42,193,188,${(0.45 * n).toFixed(2)})`;
      glowRaf = requestAnimationFrame(step);
    };
    glowRaf = requestAnimationFrame(step);
  }
  function stopGlow() { cancelAnimationFrame(glowRaf); logo.style.textShadow = "none"; }

  // ===== 연기처럼 사라지기 =====
  // 글자를 노이즈로 일렁이게 비틀고, 점점 흐리게 번지며, 색이 빠지고, 투명해짐.
  // 동시에 오른쪽에서 부는 바람에 실려 왼쪽으로 흘러가며, 오른쪽부터 지워짐
  function setFx(scale, blurX, blurY, sat, freqShift) {
    fxDisp.setAttribute("scale", scale.toFixed(2));
    fxBlur.setAttribute("stdDeviation", `${blurX.toFixed(2)} ${blurY.toFixed(2)}`);
    fxSat.setAttribute("values", sat.toFixed(3));
    fxNoise.setAttribute("baseFrequency", `${(0.010 + freqShift * 0.004).toFixed(4)} ${(0.035 - freqShift * 0.012).toFixed(4)}`);
  }

  // 촛불을 "후-" 부는 순간처럼:
  // ① 왼쪽으로 휨 → ② 움츠러듦 → ③ 오른쪽 위로 끌려감 → 한 프레임에 꺼짐 → ④ 가는 연기 줄기
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;

  function dissolve() {
    setFx(0, 0, 0, 1, 0);
    logo.classList.remove("in");
    logo.classList.add("smoking");
    const t1 = LEAN_MS, t2 = t1 + SHRINK_MS, t3 = t2 + WHIP_MS;
    const t0 = performance.now();
    const step = (now) => {
      const t = now - t0;
      if (t >= t3) {
        // 한 프레임에 꺼짐: 효과와 스타일을 모두 걷어내고 글자를 숨긴 뒤 연기 시작
        const rect = logo.getBoundingClientRect();
        logo.classList.remove("smoking");
        logo.classList.add("out");
        logo.style.transform = "";
        logo.style.filter = "";
        setFx(0, 0, 0, 1, 0);
        startSmoke(rect);
        return;
      }
      const a = ease(seg(t, 0, t1));    // 왼쪽으로 휨
      const b = ease(seg(t, t1, t2));   // 움츠러듦
      const c = ease(seg(t, t2, t3));   // 오른쪽 위로 끌려감
      // 기울기(+는 윗부분이 왼쪽으로): 0 → +18° → +6° → -28°
      const skew = lerp(lerp(lerp(0, 18, a), 6, b), -28, c);
      const sx = lerp(lerp(1, 0.92, b), 1.18, c);
      const sy = lerp(lerp(lerp(1, 0.9, a), 0.65, b), 0.8, c);
      const tx = lerp(lerp(0, -8, a), 22, c);
      const ty = lerp(0, -10, c);
      logo.style.transform =
        `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) skewX(${skew.toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
      // 불꽃처럼 살짝 일렁이고, 움츠러들 때 순간 밝아짐
      setFx(6 + 10 * a + 8 * c, 0.3 + 0.6 * c, 0.3, 1, a);
      logo.style.filter = `url(#smokeFx) brightness(${(1 + 0.25 * b * (1 - c)).toFixed(3)})`;
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  // ===== 꺼진 뒤 피어오르는 가는 연기 줄기 (참고 영상처럼 S자로 흔들리며 올라가 흩어짐) =====
  // 캔버스 2장: 넓고 흐린 연기(soft) + 가운데 가는 심(core). 흐림은 CSS로 캔버스 전체에 한 번만 적용(가벼움)
  const layers = [
    { el: $("smokeSoft"), wMul: 4, aMul: 0.35, blur: 7 },
    { el: $("smoke"),     wMul: 1, aMul: 1.0,  blur: 1.2 },
  ];
  for (const L of layers) L.ctx = L.el.getContext("2d");
  let smokeRaf = 0;
  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    for (const L of layers) {
      L.el.width = innerWidth * dpr;
      L.el.height = innerHeight * dpr;
      L.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }
  addEventListener("resize", sizeCanvas);
  sizeCanvas();
  function clearSmoke() {
    cancelAnimationFrame(smokeRaf);
    for (const L of layers) { L.ctx.clearRect(0, 0, innerWidth, innerHeight); L.el.style.filter = "none"; }
  }

  function startSmoke(rect) {
    // 글자 윗부분 세 군데(심지처럼)에서 한 줄기씩. 가운데 줄기가 가장 진함
    const glyphTop = rect.top + rect.height * 0.3;
    const unit = rect.height / 2.2;  // ≈ 글자 크기 1em. 로고 크기에 비례
    const wisps = [
      { x: rect.left + rect.width * 0.28, s: 0.50, ph: 0.0, rise: 0.85, amp: 0.8, sp: 2.6 },
      { x: rect.left + rect.width * 0.53, s: 1.00, ph: 1.7, rise: 1.10, amp: 1.0, sp: 3.0 },
      { x: rect.left + rect.width * 0.77, s: 0.65, ph: 3.4, rise: 0.95, amp: 0.9, sp: 2.3 },
    ];
    const t0 = performance.now();
    const step = (now) => {
      const t = (now - t0) / 1000;               // 초
      const T = SMOKE_MS / 1000;
      if (t >= T) { clearSmoke(); return; }      // 잔상 방지: 끝나면 캔버스를 완전히 비움
      const fadeIn = Math.min(1, t / 0.15);
      const fadeOut = 1 - Math.pow(seg(t, T * 0.4, T), 1.3);
      for (const L of layers) {
        const c = L.ctx;
        c.clearRect(0, 0, innerWidth, innerHeight);
        L.el.style.filter = `blur(${(L.blur + t * 2).toFixed(2)}px)`;   // 시간이 갈수록 더 퍼짐
        c.lineCap = "round";
        for (const w of wisps) {
          const maxH = unit * 4.2 * w.rise;
          const head = Math.min(maxH, unit * 3.0 * w.rise * t);      // 연기 머리가 천천히 올라감
          const tail = Math.max(0, unit * 1.6 * (t - 1.0));           // 1초쯤 지나면 아래쪽이 심지에서 떨어짐
          if (head - tail < 2) continue;
          let px = null, py = null;
          for (let h = tail; h <= head; h += 3) {
            const u = h / maxH;                                       // 0(아래) → 1(위)
            const amp = unit * w.amp * (0.03 + 0.7 * u * u);          // 위로 갈수록 크게 S자로 말림
            const x = w.x + amp * Math.sin(h / (unit * 0.6) - t * w.sp + w.ph) + unit * 0.4 * u * u; // 살짝 오른쪽 위로
            const y = glyphTop - h;
            if (px !== null) {
              const alpha = L.aMul * 0.5 * w.s * fadeIn * fadeOut * Math.pow(1 - u, 1.2)
                          * Math.min(1, (h - tail) / (unit * 0.4));
              if (alpha > 0.003) {
                c.strokeStyle = `rgba(210,213,218,${alpha.toFixed(3)})`;
                c.lineWidth = L.wMul * (1.4 + u * unit * 0.14);       // 위로 갈수록 퍼짐
                c.beginPath(); c.moveTo(px, py); c.lineTo(x, y); c.stroke();
              }
            }
            px = x; py = y;
          }
        }
      }
      smokeRaf = requestAnimationFrame(step);
    };
    smokeRaf = requestAnimationFrame(step);
  }

  // ===== "후-" 입김 소리 (사용자 클릭 이후에만 재생 가능) =====
  function playBlowSound() {
    if (!audioCtx) return;
    const dur = 0.6, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * dur, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.35, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(rafId); stopGlow();
    logo.classList.remove("in", "smoking", "out");
    logo.style.opacity = ""; logo.style.transform = ""; logo.style.filter = "";
    setFx(0, 0, 0, 1, 0);
    clearSmoke();
    replayBtn.classList.remove("show");
    void logo.offsetWidth;
  }

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function play() {
    reset();
    at(T.logoIn, () => { logo.classList.add("in"); startGlow(); });
    at(T.dissolve, () => {
      stopGlow();
      playBlowSound();
      dissolve();
    });
    at(T.done, () => replayBtn.classList.add("show"));
  }

  replayBtn.addEventListener("click", () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) { audioCtx = null; }
    play();
  });

  // 외부에서 호출: window.playBaeminEnding()
  window.playBaeminEnding = play;

  // 폰트 로드 후 자동 재생 (?autoplay=0 이면 대기)
  const auto = new URLSearchParams(location.search).get("autoplay") !== "0";
  if (auto) (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
</body>
</html>
