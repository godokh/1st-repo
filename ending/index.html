<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>배달의민족 엔딩</title>
<!-- 도현체(BM 도현): 우아한형제들이 만든 무료 폰트 (Google Fonts 배포본) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root { --mint: #2ac1bc; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .logo {
    position: relative;
    font-family: "Do Hyeon", "BM DoHyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(48px, 15vmin, 200px);
    line-height: 1;
    color: var(--mint);
    letter-spacing: -0.02em;
    white-space: nowrap;
    opacity: 0;
    transform-origin: 50% 100%;
    padding: 0.6em 1.2em;  /* 연기 효과가 번질 여유 공간 (없으면 효과가 네모나게 잘림) */
  }
  .logo .ui { font-size: 0.62em; vertical-align: 0.12em; margin: 0 0.02em; }

  /* 등장 */
  .logo.in { animation: logoIn 1s ease forwards; }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 연기로 사라지는 동안: 아래 SVG 필터(일렁임 + 번짐)를 글자에 직접 적용 */
  .logo.smoking {
    animation: none; opacity: 1; filter: url(#smokeFx); will-change: opacity, transform;
    /* 바람이 불어오는 오른쪽부터 지워지도록 마스크를 오→왼으로 밀어냄 (--m 값을 JS가 갱신) */
    --m: -40%;
    -webkit-mask-image: linear-gradient(to left, transparent var(--m), #000 calc(var(--m) + 45%));
            mask-image: linear-gradient(to left, transparent var(--m), #000 calc(var(--m) + 45%));
  }
  /* 끝난 뒤: 완전히 숨김 (잔상 없음) */
  .logo.out { animation: none; opacity: 0; filter: none; }
  .fx-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .replay {
    position: absolute;
    right: 16px;
    bottom: 16px;
    padding: 10px 16px;
    font: 15px/1 "Do Hyeon", sans-serif;
    color: #888;
    background: transparent;
    border: 1px solid #333;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, color 0.2s, border-color 0.2s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:hover { color: var(--mint); border-color: var(--mint); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <h1 class="logo" id="logo" aria-label="배달의민족"><span class="seg">배달</span><span class="seg ui">의</span><span class="seg">민족</span></h1>
    <!-- 연기 효과용 SVG 필터: 노이즈로 글자를 일렁이게 비틀고(displacement) 흐리게 번지게(blur) 함 -->
    <svg class="fx-defs" aria-hidden="true">
      <filter id="smokeFx" x="-50%" y="-120%" width="200%" height="300%" color-interpolation-filters="sRGB">
        <feTurbulence id="fxNoise" type="fractalNoise" baseFrequency="0.010 0.035" numOctaves="3" seed="7" result="noise" />
        <feDisplacementMap id="fxDisp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="disp" />
        <feGaussianBlur id="fxBlur" in="disp" stdDeviation="0" result="blur" />
        <feColorMatrix id="fxSat" in="blur" type="saturate" values="1" />
      </filter>
    </svg>
    <button class="replay" id="replay" type="button">↻ 다시 보기</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logo = $("logo"), replayBtn = $("replay");
  const fxNoise = $("fxNoise"), fxDisp = $("fxDisp"), fxBlur = $("fxBlur"), fxSat = $("fxSat");

  // ===== 타임라인 (ms) — 숫자만 바꾸면 길이 조절 =====
  const T = {
    logoIn:   300,   // 로고 등장
    dissolve: 3000,  // 바람이 불어 꺼지는 순간
    done:     5100,  // 다시보기 버튼
  };
  const GUST_MS = 140;  // ① 바람이 닿아 순간 휘청이는 시간
  const OUT_MS  = 160;  // ② 탁 꺼지는 시간 (밝기가 확 떨어짐)
  const WISP_MS = 1300; // ③ 꺼진 뒤 남은 연기가 흘러가 사라지는 시간 (끝나면 완전히 숨겨 잔상 없음)

  let timers = [], rafId = 0, glowRaf = 0, audioCtx = null;

  // ===== 켜져 있는 동안 촛불처럼 은은하게 일렁이는 빛 =====
  function startGlow() {
    const step = (now) => {
      const n = 0.85 + 0.1 * Math.sin(now / 95) + 0.05 * Math.sin(now / 41 + 1.3) + (Math.random() - 0.5) * 0.04;
      logo.style.textShadow = `0 0 ${Math.round(22 * n)}px rgba(42,193,188,${(0.45 * n).toFixed(2)})`;
      glowRaf = requestAnimationFrame(step);
    };
    glowRaf = requestAnimationFrame(step);
  }
  function stopGlow() { cancelAnimationFrame(glowRaf); logo.style.textShadow = "none"; }

  // ===== 연기처럼 사라지기 =====
  // 글자를 노이즈로 일렁이게 비틀고, 점점 흐리게 번지며, 색이 빠지고, 투명해짐.
  // 동시에 오른쪽에서 부는 바람에 실려 왼쪽으로 흘러가며, 오른쪽부터 지워짐
  function setFx(scale, blurX, blurY, sat, freqShift) {
    fxDisp.setAttribute("scale", scale.toFixed(2));
    fxBlur.setAttribute("stdDeviation", `${blurX.toFixed(2)} ${blurY.toFixed(2)}`);
    fxSat.setAttribute("values", sat.toFixed(3));
    fxNoise.setAttribute("baseFrequency", `${(0.010 + freqShift * 0.004).toFixed(4)} ${(0.035 - freqShift * 0.012).toFixed(4)}`);
  }

  // 촛불을 "후-" 부는 순간처럼: ① 바람에 순간 휘청 → ② 탁 꺼짐 → ③ 가는 연기만 왼쪽 위로 흘러가다 사라짐
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));

  function dissolve() {
    setFx(0, 0, 0, 1, 0);
    logo.classList.remove("in");
    logo.classList.add("smoking");
    const t0 = performance.now();
    const step = (now) => {
      const t = now - t0;
      const g = ease(seg(t, 0, GUST_MS));                    // ① 바람이 닿아 휘청
      const o = ease(seg(t, GUST_MS, GUST_MS + OUT_MS));     // ② 탁 꺼짐
      const sm = seg(t, GUST_MS, GUST_MS + OUT_MS + WISP_MS); // ③ 남은 연기
      const sme = ease(sm);

      setFx(
        25 * g + 45 * o + 60 * sme,              // 일렁임: 휘청일 때 살짝 → 꺼지면서 크게
        1.5 * g + 4 * o + 10 * sme,              // 가로 번짐 (바람결 방향)
        0.8 * g + 2.5 * o + 6 * sme,             // 세로 번짐
        1 - 0.8 * o,                             // 꺼지는 순간 색이 빠져 회색 연기로
        sm
      );
      // 밝기: 휘청이는 동안은 그대로, 꺼지는 순간 확 떨어지고(남은 연기 20%), 연기는 서서히 0으로
      const opacity = t < GUST_MS ? 1 : (1 - 0.8 * o) * Math.pow(1 - sm, 1.4);
      logo.style.opacity = opacity.toFixed(3);
      const dx = -14 * g - innerWidth * 0.12 * sme;          // 오른쪽에서 부는 바람 → 왼쪽으로
      const dy = -40 * sme;                                   // 연기는 위로 떠오름
      logo.style.transform =
        `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) skewX(${(12 * g * (1 - o * 0.4)).toFixed(2)}deg) scale(${(1 + 0.03 * g + 0.15 * sme).toFixed(3)}, ${(1 - 0.06 * g).toFixed(3)})`;
      logo.style.setProperty("--m", `${(-40 + 150 * sm).toFixed(1)}%`); // 연기는 오른쪽부터 흩어짐

      if (sm < 1) {
        rafId = requestAnimationFrame(step);
      } else {
        // 잔상 방지: 필터와 스타일을 모두 걷어내고 글자를 완전히 숨김
        logo.classList.remove("smoking");
        logo.classList.add("out");
        logo.style.opacity = "";
        logo.style.transform = "";
        logo.style.removeProperty("--m");
        setFx(0, 0, 0, 1, 0);
      }
    };
    rafId = requestAnimationFrame(step);
  }


  // ===== "후-" 입김 소리 (사용자 클릭 이후에만 재생 가능) =====
  function playBlowSound() {
    if (!audioCtx) return;
    const dur = 0.6, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * dur, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.35, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(rafId); stopGlow();
    logo.classList.remove("in", "smoking", "out");
    logo.style.opacity = ""; logo.style.transform = ""; logo.style.removeProperty("--m");
    setFx(0, 0, 0, 1, 0);
    replayBtn.classList.remove("show");
    void logo.offsetWidth;
  }

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function play() {
    reset();
    at(T.logoIn, () => { logo.classList.add("in"); startGlow(); });
    at(T.dissolve, () => {
      stopGlow();
      playBlowSound();
      dissolve();
    });
    at(T.done, () => replayBtn.classList.add("show"));
  }

  replayBtn.addEventListener("click", () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) { audioCtx = null; }
    play();
  });

  // 외부에서 호출: window.playBaeminEnding()
  window.playBaeminEnding = play;

  // 폰트 로드 후 자동 재생 (?autoplay=0 이면 대기)
  const auto = new URLSearchParams(location.search).get("autoplay") !== "0";
  if (auto) (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
</body>
</html>
