<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>배달의민족 엔딩</title>
<!-- 도현체(BM 도현): 우아한형제들이 만든 무료 폰트 (Google Fonts 배포본) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root { --mint: #2ac1bc; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .logo {
    position: relative;
    font-family: "Do Hyeon", "BM DoHyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(48px, 15vmin, 200px);
    line-height: 1;
    color: var(--mint);
    letter-spacing: -0.02em;
    white-space: nowrap;
    opacity: 0;
    transform-origin: 50% 100%;
    padding: 0.6em 1.2em;  /* 연기 효과가 번질 여유 공간 (없으면 효과가 네모나게 잘림) */
  }
  .logo .ui { font-size: 0.62em; vertical-align: 0.12em; margin: 0 0.02em; }

  /* 등장 */
  .logo.in { animation: logoIn 1s ease forwards; }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 연기로 사라지는 동안: 아래 SVG 필터(일렁임 + 번짐)를 글자에 직접 적용 */
  .logo.smoking {
    animation: none; opacity: 1; filter: url(#smokeFx); will-change: opacity, transform;
    /* 바람이 불어오는 왼쪽부터 지워지도록 마스크를 왼→오로 밀어냄 (--m 값을 JS가 갱신) */
    --m: -40%;
    -webkit-mask-image: linear-gradient(to right, transparent var(--m), #000 calc(var(--m) + 40%));
            mask-image: linear-gradient(to right, transparent var(--m), #000 calc(var(--m) + 40%));
  }
  /* 끝난 뒤: 완전히 숨김 (잔상 없음) */
  .logo.out { animation: none; opacity: 0; filter: none; }
  .fx-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .replay {
    position: absolute;
    right: 16px;
    bottom: 16px;
    padding: 10px 16px;
    font: 15px/1 "Do Hyeon", sans-serif;
    color: #888;
    background: transparent;
    border: 1px solid #333;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, color 0.2s, border-color 0.2s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:hover { color: var(--mint); border-color: var(--mint); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <h1 class="logo" id="logo" aria-label="배달의민족"><span class="seg">배달</span><span class="seg ui">의</span><span class="seg">민족</span></h1>
    <!-- 연기 효과용 SVG 필터: 노이즈로 글자를 일렁이게 비틀고(displacement) 흐리게 번지게(blur) 함 -->
    <svg class="fx-defs" aria-hidden="true">
      <filter id="smokeFx" x="-40%" y="-120%" width="180%" height="300%" color-interpolation-filters="sRGB">
        <feTurbulence id="fxNoise" type="fractalNoise" baseFrequency="0.010 0.035" numOctaves="3" seed="7" result="noise" />
        <feDisplacementMap id="fxDisp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="disp" />
        <feGaussianBlur id="fxBlur" in="disp" stdDeviation="0" result="blur" />
        <feColorMatrix id="fxSat" in="blur" type="saturate" values="1" />
      </filter>
    </svg>
    <button class="replay" id="replay" type="button">↻ 다시 보기</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logo = $("logo"), replayBtn = $("replay");
  const fxNoise = $("fxNoise"), fxDisp = $("fxDisp"), fxBlur = $("fxBlur"), fxSat = $("fxSat");

  // ===== 타임라인 (ms) — 숫자만 바꾸면 길이 조절 =====
  const T = {
    logoIn:   300,   // 로고 등장
    dissolve: 3000,  // 로고가 바로 연기로 흩어지기 시작
    done:     6100,  // 다시보기 버튼
  };
  const WAVER_MS = 1100; // 1단계: 제자리에서 연기처럼 일렁이는 시간
  const FLY_MS   = 1500; // 2단계: 바람에 오른쪽으로 날아가며 사라지는 시간 (끝나면 완전히 숨겨 잔상 없음)

  let timers = [], rafId = 0, glowRaf = 0, audioCtx = null;

  // ===== 켜져 있는 동안 촛불처럼 은은하게 일렁이는 빛 =====
  function startGlow() {
    const step = (now) => {
      const n = 0.85 + 0.1 * Math.sin(now / 95) + 0.05 * Math.sin(now / 41 + 1.3) + (Math.random() - 0.5) * 0.04;
      logo.style.textShadow = `0 0 ${Math.round(22 * n)}px rgba(42,193,188,${(0.45 * n).toFixed(2)})`;
      glowRaf = requestAnimationFrame(step);
    };
    glowRaf = requestAnimationFrame(step);
  }
  function stopGlow() { cancelAnimationFrame(glowRaf); logo.style.textShadow = "none"; }

  // ===== 일렁이다가 바람에 날아가듯 사라지기 =====
  function setFx(scale, blurX, blurY, sat, fx, fy) {
    fxDisp.setAttribute("scale", scale.toFixed(2));
    fxBlur.setAttribute("stdDeviation", `${blurX.toFixed(2)} ${blurY.toFixed(2)}`);
    fxSat.setAttribute("values", sat.toFixed(3));
    fxNoise.setAttribute("baseFrequency", `${fx.toFixed(4)} ${fy.toFixed(4)}`);
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  function clearFx() {
    setFx(0, 0, 0, 1, 0.012, 0.03);
    logo.style.opacity = ""; logo.style.transform = ""; logo.style.removeProperty("--m");
  }

  function dissolve() {
    clearFx();
    logo.classList.remove("in");
    logo.classList.add("smoking");
    const t0 = performance.now();
    const step = (now) => {
      const t = now - t0;
      if (t < WAVER_MS) {
        // 1단계: 제자리에서 연기처럼 일렁임 (노이즈 모양이 계속 바뀌어 아지랑이처럼 흔들림)
        const w = t / WAVER_MS;
        const wave = Math.sin(t / 140);
        setFx(
          4 + 12 * w + 3 * wave,                 // 일렁임 세기: 점점 커짐
          0.4 + 0.8 * w, 0.4 + 0.8 * w,          // 아주 살짝 번짐
          1,
          0.012 + 0.003 * Math.sin(t / 230),     // 노이즈가 계속 흘러 움직임
          0.030 + 0.008 * Math.cos(t / 190)
        );
        logo.style.transform = `translateY(${(-4 * w).toFixed(1)}px)`;
        logo.style.opacity = "1";
        logo.style.setProperty("--m", "-40%");
      } else {
        // 2단계: 바람에 오른쪽으로 날아감 — 점점 가속, 가로로 늘어나며 흩날리고 투명해짐
        const k = Math.min(1, (t - WAVER_MS) / FLY_MS);
        const e = k * k;                         // 바람에 실려 점점 빨라짐
        setFx(
          16 + 90 * e,                           // 크게 흩날림
          1.2 + 16 * e,                          // 가로 방향으로 길게 번짐
          1.2 + 3 * e,
          1 - 0.8 * k,                           // 민트 → 회색빛
          lerp(0.012, 0.003, k),                 // 노이즈를 가로로 긴 결로 바꿔 바람결처럼 보이게
          lerp(0.030, 0.090, k)
        );
        const dx = innerWidth * 0.45 * e;
        logo.style.transform =
          `translate(${dx.toFixed(1)}px, ${(-4 - 34 * e).toFixed(1)}px) skewX(${(-14 * e).toFixed(2)}deg) scale(${(1 + 0.5 * e).toFixed(3)}, ${(1 - 0.15 * e).toFixed(3)})`;
        logo.style.opacity = Math.pow(1 - k, 1.3).toFixed(3);
        logo.style.setProperty("--m", `${(-40 + 150 * k).toFixed(1)}%`); // 왼쪽부터 날려 지워짐
        if (k >= 1) {
          // 잔상 방지: 효과를 모두 걷어내고 글자를 완전히 숨김
          logo.classList.remove("smoking");
          logo.classList.add("out");
          clearFx();
          return;
        }
      }
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  // ===== "후-" 입김 소리 (사용자 클릭 이후에만 재생 가능) =====
  function playBlowSound() {
    if (!audioCtx) return;
    const dur = 0.6, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * dur, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.35, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(rafId); stopGlow();
    logo.classList.remove("in", "smoking", "out");
    clearFx();
    replayBtn.classList.remove("show");
    void logo.offsetWidth;
  }

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function play() {
    reset();
    at(T.logoIn, () => { logo.classList.add("in"); startGlow(); });
    at(T.dissolve, () => {
      stopGlow();
      dissolve();
      at(WAVER_MS, playBlowSound); // 바람이 부는 순간 "후-" 소리
    });
    at(T.done, () => replayBtn.classList.add("show"));
  }

  replayBtn.addEventListener("click", () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) { audioCtx = null; }
    play();
  });

  // 외부에서 호출: window.playBaeminEnding()
  window.playBaeminEnding = play;

  // 폰트 로드 후 자동 재생 (?autoplay=0 이면 대기)
  const auto = new URLSearchParams(location.search).get("autoplay") !== "0";
  if (auto) (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
</body>
</html>
